name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on every push. Needs metamoim and nothing else: the expected output is
  # test/golden, which is in the repository.
  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev libbz2-dev ccache

      - name: restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j $(nproc)

      - name: build fixtures
        run: |
          python3 test/make_fixture.py test/fixture
          python3 test/make_real_fixture.py test/fixture_real

      # Byte for byte against test/golden, plus a readable summary of what the run meant.
      # A failure here is either an unintended change or a golden that was not refreshed.
      - name: golden
        run: ./test/run_golden.sh

      # The answer must not depend on how the work was divided or how tight memory and
      # disk were. These run metamoim against itself, so no golden is involved.
      - name: thread and partition invariance
        run: |
          ./test/run_invariance.sh
          MODE=easy-grouping WORK=$PWD/test/work_invariance_star ./test/run_invariance.sh

      - name: flush and fold invariance
        run: ./test/run_flush.sh

      - name: keep the failing run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test/work_golden/**/summary.txt
            test/work_golden/**/manifest.sha256
            test/work_golden/**/*.log
          retention-days: 7

  # Not on every push: this one builds Metabuli as well and takes the long way round.
  # It is what re-establishes the golden as "the same thing Metabuli 64680ee4 produced"
  # rather than "whatever we produced last time", so run it when the golden moves.
  equivalence:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev libbz2-dev ccache

      - name: checkout Metabuli at the commit metamoim was split from
        uses: actions/checkout@v4
        with:
          repository: steineggerlab/Metabuli
          ref: 64680ee412627259cfb10ab46583fe3dc3170ffe
          submodules: recursive
          path: metabuli

      - name: restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-equiv-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-equiv-${{ runner.os }}-

      - name: build both
        run: |
          for d in . metabuli; do
            cmake -S $d -B $d/build -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build $d/build -j $(nproc)
          done

      - name: build fixtures
        run: |
          python3 test/make_fixture.py test/fixture
          python3 test/make_real_fixture.py test/fixture_real

      - name: equivalence
        env:
          METABULI: ${{ github.workspace }}/metabuli/build/src/metabuli
        run: |
          ./test/run_equivalence.sh
          FIXTURE=$PWD/test/fixture_real WORK=$PWD/test/work_real ./test/run_equivalence.sh
