name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on every push. Needs metamoim and nothing else: the expected output is
  # test/golden, which is in the repository.
  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev libbz2-dev ccache

      - name: restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j $(nproc)

      - name: build fixtures
        run: |
          python3 test/make_fixture.py test/fixture
          python3 test/make_real_fixture.py test/fixture_real

      # Byte for byte against test/golden, plus a readable summary of what the run meant.
      # A failure here is either an unintended change or a golden that was not refreshed.
      - name: golden
        run: ./test/run_golden.sh

      # The answer must not depend on how the work was divided or how tight memory and
      # disk were. These run metamoim against itself, so no golden is involved.
      - name: thread and partition invariance
        run: |
          ./test/run_invariance.sh
          MODE=easy-grouping WORK=$PWD/test/work_invariance_star ./test/run_invariance.sh

      - name: flush and fold invariance
        run: ./test/run_flush.sh

      - name: keep the failing run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test/work_golden/**/summary.txt
            test/work_golden/**/manifest.sha256
            test/work_golden/**/*.log
          retention-days: 7
